services:
  - type: web
    name: llmario
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: GROQ_API_KEY 
        sync: false
      - key: GEMINI_API_KEY 
        sync: false
